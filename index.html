<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Acessível - Tecnologia e Inclusão</title>
  
  <style>
    /* ===================================================
       1. VARIÁVEIS E TEMAS (PADRÃO, ESCURO E DALTONISMO)
       =================================================== */
    :root {
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --card-bg: #ffffff;
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --border-color: #dee2e6;
      --focus-outline: #ffcc00;
      --base-font-size: 16px;
    }

    /* Modo Escuro / Alto Contraste */
    body.theme-dark {
      --bg-color: #121212;
      --text-color: #f8f9fa;
      --card-bg: #1e1e1e;
      --primary-color: #6ea8fe;
      --primary-hover: #9ec5fe;
      --border-color: #495057;
    }

    /* Protanopia (Deficiência do Vermelho) */
    body.theme-protanopia {
      --bg-color: #f4f4f6;
      --text-color: #111111;
      --card-bg: #e6f0ff;
      --primary-color: #0072b2;
      --border-color: #b0bec5;
    }

    /* Deuteranopia (Deficiência do Verde) */
    body.theme-deuteranopia {
      --bg-color: #faf9f5;
      --text-color: #1a1a1a;
      --card-bg: #fff8e1;
      --primary-color: #d55e00;
      --border-color: #ffe082;
    }

    /* Tritanopia (Deficiência do Azul) */
    body.theme-tritanopia {
      --bg-color: #f5f5f5;
      --text-color: #111111;
      --card-bg: #ffebee;
      --primary-color: #cc79a7;
      --border-color: #ef9a9a;
    }

    /* ===================================================
       2. ESTILOS GERAIS E ESTRUTURA
       =================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--base-font-size);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Foco acessível via teclado */
    :focus {
      outline: 4px solid var(--focus-outline) !important;
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      top: -50px;
      left: 10px;
      background: #000;
      color: #fff;
      padding: 10px 15px;
      z-index: 10000;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .skip-link:focus {
      top: 10px;
    }

    /* ===================================================
       3. PAINEL E FERRAMENTAS DE ACESSIBILIDADE
       =================================================== */
    .accessibility-bar {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--border-color);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-acc {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-acc:hover {
      background-color: var(--primary-hover);
    }

    .btn-acc:active {
      transform: scale(0.96);
    }

    select.select-acc {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
    }

    /* ===================================================
       4. MECÂNICA DA LUPA (ZOOM AO PASSAR O MOUSE)
       =================================================== */
    body.magnifier-active p,
    body.magnifier-active h1,
    body.magnifier-active h2,
    body.magnifier-active h3,
    body.magnifier-active li,
    body.magnifier-active .card {
      transition: transform 0.15s ease-in-out;
    }

    body.magnifier-active p:hover,
    body.magnifier-active h1:hover,
    body.magnifier-active h2:hover,
    body.magnifier-active h3:hover,
    body.magnifier-active li:hover,
    body.magnifier-active .card:hover {
      transform: scale(1.15);
      transform-origin: left center;
      background-color: rgba(255, 204, 0, 0.25) !important;
      border-radius: 6px;
    }

    /* ===================================================
       5. LAYOUT E CONTEÚDO DO SITE
       =================================================== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header.main-header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    /* ===================================================
       6. RODAPÉ E LICENÇA
       =================================================== */
    footer {
      background-color: var(--card-bg);
      border-top: 2px solid var(--border-color);
      margin-top: 50px;
      padding: 30px 20px;
    }

    .footer-content {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
